<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugin</title>
  <style>
    body{max-width:900px;margin:20px auto;padding:0 20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6;color:#24292e}
    pre{background:#f6f8fa;padding:16px;overflow:auto;border-radius:6px}
    code{background:#f6f8fa;padding:2px 6px;border-radius:3px;font-family:SFMono-Regular,Consolas,monospace;font-size:85%}
    pre code{padding:0;background:transparent}
    a{color:#0366d6;text-decoration:none}
    a:hover{text-decoration:underline}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #dfe2e5;padding:8px 12px;text-align:left}
    th{background:#f6f8fa;font-weight:600}
    img{max-width:100%}
    blockquote{border-left:4px solid #dfe2e5;margin:0;padding:0 16px;color:#6a737d}
    h1,h2,h3{border-bottom:1px solid #eaecef;padding-bottom:.3em}
  </style>
</head>
<body>
  <div id="content">Loading README.md...</div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (async()=>{
      const u=`https://raw.githubusercontent.com/femboo/Plugin/main/README.md`;
      const p=`https://corsproxy.io/?url=${encodeURIComponent(u)}`;
      try{
        const r=await fetch(p);
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        const m=await r.text();
        document.getElementById('content').innerHTML=marked.parse(m);
      }catch(e){
        document.getElementById('content').textContent='Error loading README: '+e.message;
      }
    })();
  </script>
</body>
</html>
